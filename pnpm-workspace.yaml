packages:
  - 'packages/*'
allowBuilds:
  # These are small projects, that we dont trust 100%, so they are not allowed to run scripts
  # used by style-dictionary
  '@bundled-es-modules/glob': false
  # used by fantasticon
  es5-ext: false
  cypress: true
  dprint: true
  esbuild: true
  nx: true
  style-dictionary: true
  ttf2woff2: true
# eslint-plugin-react is loaded by oxlint (jsPlugins). It only reads eslint/package.json, so it
# works with ESLint 10 even though its declared peer range stops at 9.x, which npm has deprecated.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-react>eslint': '10'
overrides:
  "react": "18.3.1"
  "react-dom": "18.3.1"
  "@types/react": "18.3.26"
  "git-raw-commits>dargs": "7.0.0"
  "browserslist": "4.28.4" # its here only because 4.28.3 is broken. Remove after July 2026
