name: Build PR preview docs
concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
# Deploying needs a write token, which Dependabot-triggered runs never get. This workflow only builds
# with a read-only token and hands the result to `preview-deploy.yml`, which holds the write access.
permissions:
  contents: read
jobs:
  build-preview:
    # fork PRs don't get previews, they would serve untrusted scripts from the docs origin
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GITHUB_PULL_REQUEST_PREVIEW: 'true'
      PUBLIC_PATH: /pr-preview/pr-${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - name: Install Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install and bootstrap
        run: pnpm install --frozen-lockfile && pnpm run bootstrap
      - name: Build docs-app
        run: pnpm run build:docs
      - name: Upload built docs
        uses: actions/upload-artifact@v7
        with:
          name: preview-docs
          path: ./packages/__docs__/__build__
          if-no-files-found: error
          retention-days: 1
